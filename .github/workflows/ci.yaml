name: CI

on:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: swift .github/scripts/nw_proxy_probe.swift
